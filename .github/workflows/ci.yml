name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.3'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy src/
      - run: uv run ruff check
      - run: uv run ruff format --check
